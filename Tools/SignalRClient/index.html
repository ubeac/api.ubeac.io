<html>
<head>
    <title></title>
    <script src="./signalr/signalr.js"></script>
    <style>
        li {
            font-family: 'Courier New', Courier, monospace;
            size: 10px;
            line-height: 30px;
        }

        ul {
            list-style-type: square
        }
    </style>
</head>
<body>
    <div style="text-align:left; width:100%; height:500px; vertical-align: top;">
        <input type="text" id="groupId" name="groupId" style="width:500px;">
        <button onclick="startConnection()"> Start Connection </button>
        <button onclick="joinGroup()"> Join Group </button>
        <button onclick="leaveGroup()"> Leave Group </button>
        <button onclick="stopConnection()"> Stop Connection </button>
        <div style="text-align:left; width:25%; height:500px; vertical-align: top; float:left;">
            <ul id="messagesList"></ul>
        </div>
        <div style="text-align:left; width:75%; height:500px; vertical-align: top; float:right;">
            <ul id="dataList"></ul>
        </div>
    </div>
</body>
</html>
<script>
    const connection = new signalR.HubConnectionBuilder()
        .withUrl('http://socket.local.ubeac.io/socket', {
        //.withUrl('http://socket.local.ubeac.io/socket', {
        //    accessTokenFactory: () => {
        //        this.loginToken
        //        console.log(this.loginToken)
        //    }
        })
        .build()
    console.log('connection was built')

    async function startConnection() {
        await connection.start()
    }

    async function stopConnection() {
        await connection.stop()
    }

    function joinGroup() {
        //var groupId = 'GatewayData/98dc0f3a-6f1d-4234-a2af-76f422a14c94/25be9f35-9018-41a7-9e5b-b14a364bbc35'

        var groupId = document.getElementById('groupId').value
        connection.invoke('join', groupId).then(() => { console.log('Joined to ' + groupId) }).catch(err => { console.log('an error acured'); console.error(err.toString()) })

        connection.on('onGroupData', (groupId, message) => {
            const gatewayData = JSON.parse(message)
            var toDate = new Date()
            var gatewayDate = new Date(gatewayData.dateTime)
            console.log(toDate)
            console.log(new Date(gatewayDate))
            console.log('================================   ========================================      ===============================')

            var timeDiff = toDate.getTime() - gatewayDate.getTime();

            const li = document.createElement('li')
            li.textContent = timeDiff + 'ms'
            document.getElementById('messagesList').appendChild(li)

            /*const li2 = document.createElement('li')
            li2.textContent = message
            document.getElementById('dataList').appendChild(li2)*/
        })
    }

    async function leaveGroup() {
        var groupId = document.getElementById('groupId').value
        connection.invoke('leave', groupId).then(() => { console.log('Left ' + groupId) }).catch(err => console.error(err.toString()))
    }
</script>
